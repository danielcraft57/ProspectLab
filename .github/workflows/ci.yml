name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m compileall app.py celery_app.py config.py routes services tasks utils

      - name: Unit tests campagnes email
        run: |
          python -m unittest scripts.tests.test_email_quality scripts.tests.test_email_subject_clean scripts.tests.test_inbox_classification scripts.tests.test_brevo_event_mapping scripts.tests.test_tracking_suspect scripts.tests.test_campaign_recipients scripts.tests.test_crosslinked_domains -v
