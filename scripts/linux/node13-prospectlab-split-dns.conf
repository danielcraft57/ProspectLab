# Split-DNS ProspectLab : domaines UI -> Nginx LAN (node12)
# Evite le CNAME public danielcraft.fr (89.159.124.25 = meme IP que le VPN).
listen-address=192.168.1.191
bind-interfaces
domain-needed
bogus-priv
no-resolv
server=8.8.8.8
server=8.8.4.4

# Ne jamais forwarder ces noms (sinon CNAME public en cache)
local=/prospectlab.danielcraft.fr/
local=/campaigns.danielcraft.fr/

# Reponses A directes (pas de CNAME)
host-record=prospectlab.danielcraft.fr,192.168.1.209
host-record=campaigns.danielcraft.fr,192.168.1.209
