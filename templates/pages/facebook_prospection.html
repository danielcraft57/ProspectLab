{% extends "base.html" %}

{% block title %}Facebook prospection - ProspectLab{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fab fa-facebook"></i> Prospection Facebook</h1>
    <p>Recherche de page, scrape et Messenger (compte danielcraft via serv1 + serv2)</p>
</div>

<div class="card">
    <div class="card-body">
        <form id="fb-prospection-form" class="scrape-form">
            <div class="form-group">
                <label for="fb-entreprise-id">ID entreprise</label>
                <input type="number" id="fb-entreprise-id" name="entreprise_id" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="fb-search-query">Nom / ville (recherche pages)</label>
                <input type="text" id="fb-search-query" name="query" class="form-input" placeholder="Ex. Boulangerie Dupont Metz">
            </div>
            <div class="form-group">
                <label for="fb-job-type">Type de job</label>
                <select id="fb-job-type" name="job_type" class="form-input">
                    <option value="search">Rechercher la page (serv1)</option>
                    <option value="scrape_page">Scraper la page (serv1)</option>
                    <option value="messenger_inbox">Inbox Messenger dry-run (serv2)</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="fb-submit-btn">Lancer</button>
            </div>
        </form>
        <div id="fb-prospection-status" class="status-message" style="display:none;margin-top:1rem;"></div>
        <div id="fb-prospection-results" style="display:none;margin-top:1.5rem;">
            <h3>Jobs recents</h3>
            <div id="fb-jobs-list"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/facebook_prospection.js') }}" defer></script>
{% endblock %}
